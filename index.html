<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; connect-src https://cnwxxlruuuqisjezsgje.supabase.co; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'self'" />
  <title>Modernized AI</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      background: #0a0a0a;
      color: #f4f4f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .card {
      width: min(100%, 30rem);
      padding: 2.5rem;
      border: 1px solid #27272a;
      border-radius: 0.875rem;
      background: #18181b;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 1rem; letter-spacing: -0.02em; }
    p { color: #a1a1aa; line-height: 1.6; margin: 0 0 2rem; }
    button {
      background: #7c3aed;
      color: #fff;
      border: 0;
      padding: 0.85rem 1.75rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #6d28d9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin: 1.5rem 0 0; font-size: 0.875rem; color: #a1a1aa; min-height: 1.25rem; }
    #status.error { color: #f87171; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Modernized AI</h1>
    <p id="tagline">Sign in to continue.</p>
    <button id="session-action" type="button" disabled>Checking session…</button>
    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.112.2';

    const SUPABASE_URL = 'https://cnwxxlruuuqisjezsgje.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_9I9IqX9bKKHMfQdjklZAdg_DpTbdPyM';
    const CALLBACK_URL = `${location.origin}/auth/callback/`;
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const action = document.getElementById('session-action');
    const status = document.getElementById('status');
    const tagline = document.getElementById('tagline');

    function showError(message) {
      status.textContent = message;
      status.classList.add('error');
      action.disabled = false;
    }

    async function signIn() {
      action.disabled = true;
      status.classList.remove('error');
      status.textContent = 'Opening GitHub sign in…';
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'github',
        options: { redirectTo: CALLBACK_URL },
      });
      if (error) showError(`Unable to start sign in: ${error.message}`);
    }

    async function load() {
      try {
        const { data: { user }, error } = await supabase.auth.getUser();
        if (user && !error) {
          tagline.textContent = `Signed in as ${user.email ?? 'your account'}.`;
          action.textContent = 'Sign out';
          action.disabled = false;
          action.onclick = async () => {
            action.disabled = true;
            const { error: signOutError } = await supabase.auth.signOut();
            if (signOutError) {
              showError(`Unable to sign out: ${signOutError.message}`);
              return;
            }
            location.reload();
          };
          return;
        }

        action.textContent = 'Sign in with GitHub';
        action.disabled = false;
        action.onclick = signIn;
      } catch (error) {
        action.textContent = 'Try again';
        action.onclick = () => location.reload();
        showError(`Unable to check your session: ${error.message}`);
      }
    }

    load();
  </script>
</body>
</html>
