<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; connect-src https://cnwxxlruuuqisjezsgje.supabase.co; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'self'" />
  <title>Signing in… — Modernized AI</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      background: #0a0a0a;
      color: #f4f4f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid #27272a;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #a1a1aa; margin: 0; }
    .error { color: #f87171; }
    a { color: #c4b5fd; margin-top: 1rem; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <div class="spinner" id="spinner" aria-hidden="true"></div>
  <p id="message" role="status" aria-live="polite">Completing sign in…</p>
  <a id="return-home" href="/" hidden>Return to sign in</a>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.112.2';

    const SUPABASE_URL = 'https://cnwxxlruuuqisjezsgje.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_9I9IqX9bKKHMfQdjklZAdg_DpTbdPyM';
    const RETURN_TO_KEY = 'modernized-ai.return_to';
    const CONSENT_PATH = '/oauth/consent/';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const message = document.getElementById('message');
    const spinner = document.getElementById('spinner');
    const returnHome = document.getElementById('return-home');

    function fail(text) {
      spinner.hidden = true;
      message.textContent = text;
      message.classList.add('error');
      returnHome.hidden = false;
    }

    function safeReturnPath() {
      const value = sessionStorage.getItem(RETURN_TO_KEY);
      if (!value) return '/';

      try {
        const url = new URL(value, location.origin);
        if (url.origin === location.origin && url.pathname === CONSENT_PATH) {
          return `${url.pathname}${url.search}`;
        }
      } catch {
        // Invalid values fall back to the site root.
      }
      return '/';
    }

    function oauthError() {
      const query = new URLSearchParams(location.search);
      const fragment = new URLSearchParams(location.hash.slice(1));
      return query.get('error_description') || query.get('error') ||
        fragment.get('error_description') || fragment.get('error');
    }

    const callbackError = oauthError();
    if (callbackError) {
      sessionStorage.removeItem(RETURN_TO_KEY);
      history.replaceState(null, '', location.pathname);
      fail(`Sign in failed: ${callbackError}`);
    } else {
      const returnPath = safeReturnPath();
      let attempts = 0;

      async function settle() {
        attempts += 1;
        try {
          const { data: { user } } = await supabase.auth.getUser();
          if (user) {
            sessionStorage.removeItem(RETURN_TO_KEY);
            history.replaceState(null, '', location.pathname);
            message.textContent = 'Signed in. Redirecting…';
            location.replace(returnPath);
            return;
          }
        } catch {
          // The SDK may still be processing the provider response.
        }

        if (attempts < 10) {
          setTimeout(settle, 300);
        } else {
          fail('Sign-in timed out. Return to the sign-in page and try again.');
        }
      }

      settle();
    }
  </script>
</body>
</html>
